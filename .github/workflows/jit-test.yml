# Fake CI: exercises the shared pool of just-in-time runners (fclairamb/gha-job-dispatcher).
# Push/dispatch only: never run self-hosted jobs on pull requests from forks.
name: JIT runner test

on:
  push:
    branches: [chore/jit-runner-test]
  workflow_dispatch:

jobs:
  fake-ci:
    runs-on: [self-hosted, jit]
    strategy:
      matrix:
        job: [lint, test, build]
    steps:
      - uses: actions/checkout@v5
      - name: Where am I?
        run: |
          echo "job=${{ matrix.job }} runner=$RUNNER_NAME"
          uname -a
          cat /etc/os-release | head -2
      - name: Pretend to work
        run: sleep 20
